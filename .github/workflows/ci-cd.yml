name: Site - CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Validar e preparar site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # HTML/CSS e scripts com biblioteca padrão: não há pacotes a instalar.
      - name: Testar o validador com casos válidos e inválidos
        run: python -m unittest discover -s tests -v

      - name: Validar páginas e referências locais
        run: python scripts/validate_site.py

      - name: Preparar arquivos públicos
        env:
          SITE_COMMIT: ${{ github.sha }}
        run: python scripts/build_site.py

      - name: Enviar artefato para publicação
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publicar no GitHub Pages
    needs: ci
    # O CD só acontece após CI aprovada em um push na main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Publicar artefato validado
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Checkout para conferir a publicação
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Confirmar por HTTP a versão e os arquivos publicados
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          SITE_COMMIT: ${{ github.sha }}
        run: python scripts/check_deployment.py
